<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D 우주 탐험대</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#04030d;}
  body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#f3ecff;user-select:none;}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #speed{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;display:none;}

  .ui{position:fixed;z-index:10;}
  #title{top:10px;left:14px;font-size:clamp(15px,3.8vw,28px);color:#ffe08a;
    text-shadow:0 0 20px rgba(255,224,138,.5);white-space:nowrap;pointer-events:none;}
  #hint{top:calc(12px + clamp(22px,5vw,38px));left:14px;
    font-size:clamp(10px,2.4vw,15px);opacity:.65;pointer-events:none;}
  .pill{
    border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);
    color:#f3ecff;border-radius:999px;font-family:inherit;
    font-size:clamp(13px,3.2vw,20px);padding:9px 16px;cursor:pointer;
  }
  .pill:active{transform:scale(.95);}
  #mapBtn{top:10px;right:12px;}
  #timeBtn{bottom:16px;left:14px;}
  #boostBtn{
    right:14px;bottom:16px;
    width:clamp(74px,17vw,120px);height:clamp(74px,17vw,120px);border-radius:50%;
    border:3px solid rgba(255,160,60,.7);background:radial-gradient(circle at 35% 30%, #ffb060, #e05a20);
    color:#fff;font-family:inherit;font-size:clamp(13px,3.2vw,20px);
    cursor:pointer;box-shadow:0 0 24px rgba(255,140,40,.5);line-height:1.2;
  }
  #boostBtn:active{transform:scale(.93);box-shadow:0 0 40px rgba(255,160,60,.9);}

  .tag{
    position:fixed;transform:translate(-50%,-140%);z-index:5;pointer-events:none;
    font-size:clamp(11px,2.4vw,17px);color:#fff;opacity:.85;
    text-shadow:0 0 8px rgba(0,0,0,.9);white-space:nowrap;text-align:center;
  }
  .tag .dist{display:block;font-size:.7em;opacity:.7;}
  .tag.earth{color:#7ef0c8;font-size:clamp(12px,2.8vw,19px);animation:pulse 2s infinite;}
  .tag.belt{color:#c8b8a0;font-size:clamp(10px,2.2vw,15px);opacity:.7;}
  @keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}

  /* ===== 정보 카드 ===== */
  #card{
    left:50%;bottom:10px;transform:translateX(-50%);
    width:min(740px,96vw);background:rgba(16,12,42,.9);
    border:2px solid rgba(255,224,138,.4);border-radius:22px;
    padding:12px 14px;text-align:center;display:none;
    backdrop-filter:blur(6px);max-height:60vh;overflow-y:auto;
  }
  #card.on{display:block;animation:rise .4s;}
  @keyframes rise{from{transform:translate(-50%,30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  #cardName{font-size:clamp(19px,4.8vw,32px);color:#ffe08a;}
  #cardNick{font-size:clamp(11px,2.6vw,17px);opacity:.75;margin-top:1px;}
  .posbar{margin-top:10px;background:rgba(255,255,255,.05);border-radius:16px;padding:9px 6px;text-align:center;}
  .pos-row{display:flex;align-items:center;justify-content:center;gap:clamp(5px,1.4vw,12px);}
  .pos-sun{font-size:clamp(16px,4vw,26px);opacity:.6;}
  .pos-sun.now{opacity:1;filter:drop-shadow(0 0 8px #ffd644);transform:scale(1.3);}
  .pos-ball{border-radius:50%;width:clamp(10px,2.6vw,18px);height:clamp(10px,2.6vw,18px);opacity:.45;}
  .pos-ball.now{opacity:1;transform:scale(1.6);box-shadow:0 0 0 2px #ffd644,0 0 12px #ffd644;}
  .pos-lbl{font-size:clamp(12px,3vw,19px);color:#ffd76a;margin-top:7px;}
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
  .chip{
    background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);
    border-radius:14px;padding:7px 8px;font-size:clamp(11px,2.8vw,17px);
    line-height:1.3;text-align:left;display:flex;gap:7px;align-items:center;
  }
  .chip .ic{font-size:clamp(15px,3.6vw,24px);}
  .compare{
    margin-top:10px;background:rgba(255,255,255,.05);border-radius:16px;
    padding:8px 10px;display:flex;align-items:flex-end;justify-content:center;gap:26px;
  }
  .cmp-item{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .cmp-ball{border-radius:50%;}
  .cmp-earth{background:radial-gradient(circle at 35% 30%,#bfeaff,#3f9de0 45%,#1d63b8);}
  .cmp-lbl{font-size:clamp(10px,2.4vw,15px);opacity:.8;white-space:nowrap;}
  .cmp-note{font-size:clamp(11px,2.6vw,16px);color:#ffd76a;align-self:center;}
  #cardFact{font-size:clamp(13px,3.2vw,21px);line-height:1.5;margin-top:10px;min-height:2.6em;}
  .btn-row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:999px;font-family:inherit;cursor:pointer;
    font-size:clamp(12px,3vw,19px);padding:9px 18px;color:#3a2c00;
    background:linear-gradient(180deg,#ffd76a,#f0b429);box-shadow:0 3px 0 #b8860b;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8860b;}
  .btn.ghost{background:rgba(255,255,255,.12);color:#f3ecff;box-shadow:none;border:2px solid rgba(255,255,255,.3);}

  #flying{
    left:50%;top:16%;transform:translateX(-50%);
    font-size:clamp(16px,4.2vw,30px);color:#a8d8ff;display:none;
    text-shadow:0 0 16px rgba(120,190,255,.6);pointer-events:none;white-space:nowrap;
    animation:pulse 1s infinite;
  }

  /* 360도 관찰 */
  #inspectUI{position:fixed;inset:0;z-index:11;pointer-events:none;display:none;}
  #inspectName{position:fixed;top:12px;left:50%;transform:translateX(-50%);
    font-size:clamp(20px,5vw,36px);color:#ffe08a;text-shadow:0 0 18px rgba(255,224,138,.5);white-space:nowrap;}
  #inspectHint{position:fixed;top:calc(14px + clamp(28px,6vw,46px));left:50%;transform:translateX(-50%);
    font-size:clamp(12px,2.8vw,18px);opacity:.8;white-space:nowrap;animation:pulse 2s infinite;}
  #inspectExit{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);pointer-events:auto;
    border:none;border-radius:999px;font-family:inherit;cursor:pointer;
    font-size:clamp(15px,3.6vw,23px);padding:12px 32px;color:#3a2c00;
    background:linear-gradient(180deg,#ffd76a,#f0b429);box-shadow:0 3px 0 #b8860b;}
  #inspectExit:active{transform:translate(-50%,2px);box-shadow:0 1px 0 #b8860b;}

  /* 🚀 착륙해서 살펴보기 — 몰입 화면 */
  #landed{position:fixed;inset:0;z-index:25;display:none;overflow:hidden;background:#000;}
  #landed.on{display:block;}
  #landSky{position:absolute;inset:0;background:linear-gradient(180deg,#05030f 0%,#0a0818 38%,var(--gc,#4a3020) 100%);}
  #landStars{position:absolute;inset:0;top:0;height:46%;opacity:.9;}
  /* 지평선 뒤 언덕 (원근감) */
  #landHills{position:absolute;left:0;right:0;bottom:38%;height:16%;z-index:2;
    background-size:auto 100%;background-repeat:repeat-x;opacity:.85;
    filter:brightness(.62) contrast(1.05);}
  /* 바닥면: 원근 기울기로 넓게 펼쳐진 느낌 */
  #landGround{position:absolute;left:-40%;right:-40%;bottom:0;height:44%;z-index:3;
    background-size:auto 190%;background-position:center bottom;background-repeat:repeat-x;
    filter:saturate(1.1) brightness(1.02) contrast(1.06);
    transform-origin:center bottom;}
  #landGround::after{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.12) 22%,rgba(0,0,0,.5) 100%);}
  /* 지평선 빛번짐 */
  #landHaze{position:absolute;left:0;right:0;bottom:36%;height:14%;z-index:4;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.10) 55%,rgba(255,255,255,0) 100%);}
  /* 우주인 그림자 */
  #landShadow{position:absolute;bottom:14%;left:50%;transform:translateX(-50%);z-index:7;
    width:clamp(70px,18vw,130px);height:clamp(16px,4vw,26px);border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.62),rgba(0,0,0,0) 70%);
    transition:opacity .15s,transform .15s;}
  /* 발자국 */
  .footPrint{position:absolute;bottom:14.5%;z-index:6;font-size:clamp(13px,3vw,20px);
    opacity:.42;transform:translateX(-50%) rotate(-12deg);pointer-events:none;filter:grayscale(.4);}
  #landSkyBody{position:absolute;border-radius:50%;box-shadow:0 0 40px 10px rgba(255,255,255,.25);}
  #landBackBtn{position:fixed;top:14px;left:14px;z-index:30;pointer-events:auto;
    width:44px;height:44px;border-radius:50%;border:none;
    background:rgba(20,16,40,.7);color:#fff;font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  #landTitle{position:fixed;top:16px;left:66px;z-index:30;color:#ffe08a;
    font-size:clamp(16px,4vw,26px);text-shadow:0 0 14px rgba(0,0,0,.8);pointer-events:none;}
  #landLander{position:absolute;left:14%;bottom:14%;font-size:clamp(46px,11vw,86px);
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.6));z-index:6;}
  #landCharWrap{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:8;text-align:center;}
  #landChar{font-size:clamp(62px,16vw,118px);display:inline-block;
    filter:drop-shadow(0 14px 12px rgba(0,0,0,.6)) drop-shadow(-6px -3px 5px rgba(160,190,255,.28));}
  .walkBob{animation:aWalkBob .45s ease-in-out infinite;}
  @keyframes aWalkBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
  #landCharFlip{display:inline-block;transition:transform .15s;}
  .a-idle{animation:aIdle 2.2s ease-in-out infinite;}
  @keyframes aIdle{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
  .landFx{position:absolute;font-size:clamp(28px,7vw,50px);pointer-events:none;z-index:9;}
  #landCaption{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;
    width:min(680px,92vw);background:rgba(10,8,26,.78);border:2px solid rgba(255,224,138,.35);
    border-radius:20px;padding:12px 18px;text-align:center;backdrop-filter:blur(6px);pointer-events:auto;}
  #landCapText{font-size:clamp(14px,3.6vw,21px);line-height:1.5;color:#fff8ec;min-height:2.6em;}
  #landDots{display:flex;gap:6px;justify-content:center;margin-top:8px;}
  .ldot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);}
  .ldot.now{background:#ffd76a;}
  #landNextHint{font-size:11px;opacity:.6;margin-top:4px;color:#fff;}

  /* 🎮 착륙 RPG */
  #landItems{position:absolute;inset:0;z-index:7;pointer-events:none;}
  .landItem{position:absolute;bottom:20%;font-size:clamp(34px,8vw,58px);
    transform:translateX(-50%);filter:drop-shadow(0 6px 8px rgba(0,0,0,.6));transition:opacity .3s;}
  .landItem .ring{position:absolute;left:50%;top:50%;width:150%;height:150%;
    transform:translate(-50%,-50%);border-radius:50%;border:3px dashed rgba(255,224,138,.75);
    animation:aRing 1.6s linear infinite;}
  @keyframes aRing{0%{transform:translate(-50%,-50%) scale(.85) rotate(0);opacity:.9}
    100%{transform:translate(-50%,-50%) scale(1.1) rotate(360deg);opacity:.4}}
  .landItem.done{opacity:.35;}
  .landItem.done .ring{display:none;}
  #landHud{position:fixed;top:16px;right:14px;z-index:30;
    background:rgba(10,8,26,.75);border:2px solid rgba(255,224,138,.4);border-radius:999px;
    padding:7px 16px;font-size:clamp(13px,3.2vw,19px);color:#ffe08a;pointer-events:none;}
  #landControls{position:fixed;bottom:112px;left:0;right:0;z-index:31;
    display:flex;justify-content:space-between;align-items:center;padding:0 16px;pointer-events:none;}
  .padBtn{pointer-events:auto;border:3px solid rgba(255,255,255,.35);
    background:rgba(30,24,60,.6);color:#fff;font-family:inherit;cursor:pointer;
    width:clamp(64px,15vw,92px);height:clamp(64px,15vw,92px);border-radius:50%;
    font-size:clamp(24px,6vw,38px);display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);user-select:none;}
  .padBtn:active{transform:scale(.9);background:rgba(80,60,160,.75);}
  #btnJump{background:radial-gradient(circle at 35% 30%,#8ef0c8,#3aa878);border-color:rgba(140,255,210,.6);}
  #landCard{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);
    z-index:35;width:min(500px,92vw);background:rgba(16,12,42,.96);
    border:3px solid rgba(255,224,138,.6);border-radius:26px;padding:20px;
    text-align:center;display:none;opacity:0;transition:.3s;}
  #landCard.on{display:block;opacity:1;transform:translate(-50%,-50%) scale(1);}
  #landCardIcon{font-size:clamp(48px,12vw,80px);}
  #landCardTitle{font-size:clamp(17px,4.2vw,26px);color:#ffe08a;margin-top:4px;}
  #landCardBody{font-size:clamp(14px,3.6vw,21px);line-height:1.55;margin-top:12px;min-height:3.4em;color:#fff8ec;}
  #landCardBtn{margin-top:14px;border:none;border-radius:999px;font-family:inherit;cursor:pointer;
    font-size:clamp(15px,3.8vw,22px);padding:12px 30px;color:#3a2c00;
    background:linear-gradient(180deg,#ffd76a,#f0b429);box-shadow:0 4px 0 #b8860b;}
  #landCardBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8860b;}
  .thinkPulse{animation:aThink 1.4s ease-in-out infinite;}
  @keyframes aThink{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

  /* 📬 우주 우체부 */
  #questBtn{top:calc(18px + clamp(84px,22vw,116px));right:12px;}
  #questPanel{position:fixed;inset:0;z-index:45;background:rgba(6,4,18,.93);
    display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
  #questPanel.on{display:flex;}
  #questTitle{font-size:clamp(20px,5vw,34px);color:#ffe08a;text-align:center;}
  #questSub{font-size:clamp(12px,3vw,18px);opacity:.8;margin-top:6px;text-align:center;}
  #questList{margin-top:18px;width:min(460px,94vw);display:flex;flex-direction:column;gap:7px;
    max-height:56vh;overflow-y:auto;}
  .qrow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);
    border:2px solid rgba(255,255,255,.12);border-radius:16px;padding:9px 14px;
    font-size:clamp(13px,3.2vw,19px);}
  .qrow.done{border-color:rgba(126,240,200,.6);background:rgba(126,240,200,.12);}
  .qrow .qi{font-size:1.3em;}
  .qrow .qn{flex:1;text-align:left;}
  #questClose{margin-top:18px;border:none;border-radius:999px;font-family:inherit;cursor:pointer;
    font-size:clamp(15px,3.8vw,22px);padding:12px 34px;color:#3a2c00;
    background:linear-gradient(180deg,#ffd76a,#f0b429);box-shadow:0 4px 0 #b8860b;}

  /* 🧑‍🚀 여기 오면 어떻게 될까? 패널 */
  #lifePanel{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);z-index:12;
    background:rgba(16,12,42,.92);border:2px solid rgba(126,240,200,.5);border-radius:22px;
    padding:14px 22px;text-align:center;display:none;pointer-events:auto;
    width:min(460px,92vw);backdrop-filter:blur(6px);}
  #lifeStage{position:relative;height:110px;display:flex;align-items:center;justify-content:center;}
  #lifeChar{font-size:64px;display:inline-block;position:relative;z-index:2;}
  .lifeFx{position:absolute;font-size:34px;z-index:3;pointer-events:none;}
  #lifeText{font-size:clamp(14px,3.4vw,20px);line-height:1.5;color:#d8f8ec;margin-top:6px;}
  /* 애니메이션들 */
  .a-melt{animation:aMelt 2.2s ease-in-out infinite;transform-origin:bottom;}
  @keyframes aMelt{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.55) scaleX(1.25) translateY(18%)}60%{transform:scaleY(.5) scaleX(1.3) translateY(22%)}}
  .a-freeze{animation:aShiver .12s infinite;}
  @keyframes aShiver{0%{transform:translateX(-2px) rotate(-2deg)}100%{transform:translateX(2px) rotate(2deg)}}
  .fx-ice{font-size:86px !important;opacity:0;animation:aIceIn 2.6s ease forwards;filter:drop-shadow(0 0 12px #7ee0ff);}
  @keyframes aIceIn{0%{opacity:0;transform:scale(0)}55%{opacity:0}75%{opacity:.85;transform:scale(1.15)}100%{opacity:.85;transform:scale(1)}}
  .a-hop{animation:aHop 1.6s ease-in-out infinite;}
  @keyframes aHop{0%,100%{transform:translateY(0) scaleY(1)}12%{transform:translateY(0) scaleY(.8)}45%{transform:translateY(-52px) scaleY(1.08)}80%{transform:translateY(0)}}
  .a-floaty{animation:aFloaty 3s ease-in-out infinite;}
  @keyframes aFloaty{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-18px) rotate(8deg)}}
  .a-blow{animation:aBlow 1.6s ease-in-out infinite;}
  @keyframes aBlow{0%,100%{transform:translateX(0) rotate(0)}40%{transform:translateX(46px) rotate(22deg)}55%{transform:translateX(52px) rotate(24deg)}}
  .fx-wind{animation:aWind 1.6s linear infinite;opacity:.8;}
  @keyframes aWind{0%{transform:translateX(-70px);opacity:0}30%{opacity:.9}100%{transform:translateX(80px);opacity:0}}
  .a-happy{animation:aHappy 1s ease-in-out infinite;}
  @keyframes aHappy{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
  .fx-alt1{animation:aAlt1 2.4s infinite;}
  .fx-alt2{animation:aAlt2 2.4s infinite;}
  @keyframes aAlt1{0%,45%{opacity:1}50%,95%{opacity:.1}100%{opacity:1}}
  @keyframes aAlt2{0%,45%{opacity:.1}50%,95%{opacity:1}100%{opacity:.1}}
  .fx-ice2{font-size:1.6em !important;opacity:0;animation:aIceIn 2.6s ease forwards;filter:drop-shadow(0 0 14px #7ee0ff);}
  .a-stretch{animation:aStretch 1.8s ease-in-out infinite;transform-origin:center;}
  @keyframes aStretch{0%,100%{transform:scaleY(1) scaleX(1) rotate(0)}30%{transform:scaleY(1.8) scaleX(.55) rotate(-6deg)}
    55%{transform:scaleY(2.3) scaleX(.4) rotate(4deg)}80%{transform:scaleY(1.9) scaleX(.5) rotate(-3deg)}}
  .fx-swirl{animation:aSwirl 2.4s linear infinite;}
  @keyframes aSwirl{0%{transform:rotate(0) translateX(0)}100%{transform:rotate(360deg) translateX(0)}}
  #bhFade{position:fixed;inset:0;z-index:60;background:#000;opacity:0;pointer-events:none;}
  #bhMsg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:61;
    color:#d8c0ff;font-size:clamp(16px,4.4vw,28px);opacity:0;text-align:center;
    text-shadow:0 0 20px rgba(120,60,220,.8);pointer-events:none;white-space:nowrap;}

  /* 탐험 도장판 */
  #stamps{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:9;
    display:flex;gap:clamp(4px,1.2vw,9px);background:rgba(10,8,30,.55);border-radius:999px;
    padding:6px 12px;border:1.5px solid rgba(255,255,255,.15);}
  .stamp{width:clamp(14px,3.4vw,22px);height:clamp(14px,3.4vw,22px);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:clamp(10px,2.6vw,16px);
    opacity:.28;filter:grayscale(1);transition:.3s;}
  .stamp.got{opacity:1;filter:none;transform:scale(1.15);
    box-shadow:0 0 8px rgba(255,214,68,.8);}
  #toast{position:fixed;top:22%;left:50%;transform:translateX(-50%) scale(0);z-index:40;
    background:linear-gradient(180deg,#ffd76a,#f0b429);color:#3a2c00;
    font-size:clamp(15px,4vw,26px);padding:12px 26px;border-radius:999px;
    box-shadow:0 6px 24px rgba(0,0,0,.5);white-space:nowrap;pointer-events:none;}
  #toast.show{animation:toastpop 2.2s ease forwards;}
  @keyframes toastpop{0%{transform:translateX(-50%) scale(0)}15%{transform:translateX(-50%) scale(1.1)}
    22%{transform:translateX(-50%) scale(1)}80%{transform:translateX(-50%) scale(1);opacity:1}
    100%{transform:translateX(-50%) scale(.8);opacity:0}}
  #inspectMission{position:fixed;top:calc(16px + clamp(52px,12vw,84px));left:50%;transform:translateX(-50%);

let skyMesh=null;
(function(){
  const cv=document.createElement('canvas');cv.width=512;cv.height=256;
  const ctx=cv.getContext('2d');ctx.scale(0.5,0.5);
  const bg=ctx.createLinearGradient(0,0,0,512);
  bg.addColorStop(0,'#070516');bg.addColorStop(.5,'#0b0820');bg.addColorStop(1,'#060412');
  ctx.fillStyle=bg;ctx.fillRect(0,0,1024,512);
  // 은하수 띠 (대각선)
  ctx.save();
  ctx.translate(512,256);ctx.rotate(-0.35);
  for(let i=0;i<170;i++){
    const x=(Math.random()-0.5)*1400;
    const y=(Math.random()-0.5)*110*(1-Math.abs(x)/900);
    const r=Math.random()*26+6;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    const hue=Math.random()<0.75?'200,190,230':'230,180,200';
    g.addColorStop(0,`rgba(${hue},${Math.random()*0.10+0.03})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  }
  ctx.restore();
  // 색깔 성운 몇 개
  [['#6a4dd4',150,120],['#d44d8a',820,380],['#4dd4b8',300,420]].forEach(([c,x,y])=>{
    const g=ctx.createRadialGradient(x,y,0,x,y,70);
    g.addColorStop(0,c+'22');g.addColorStop(1,'#0000');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,70,0,7);ctx.fill();
  });

  for(let i=0;i<450;i++){
    const s=Math.random();

    const r=s<0.96?Math.random()*0.9+0.3:Math.random()*1.6+1;
    ctx.beginPath();ctx.arc(Math.random()*1024,Math.random()*512,r,0,7);ctx.fill();
  }
  const tex=new THREE.CanvasTexture(cv);

    new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide}));

// ================= 고화질 행성 텍스처 =================
function tex512(draw){
  const cv=document.createElement('canvas');cv.width=256;cv.height=128;
  const c2=cv.getContext('2d');c2.scale(0.5,0.5);
  draw(c2,512,256);
  const t=new THREE.CanvasTexture(cv);
  return t;
}
function hexCss(h){return '#'+h.toString(16).padStart(6,'0');}
function blob(ctx,x,y,rx,ry,c,a){
  ctx.globalAlpha=a;ctx.fillStyle=c;
  ctx.beginPath();ctx.ellipse(x,y,rx,ry,Math.random()*3,0,7);ctx.fill();
  ctx.globalAlpha=1;
}
function texFor(d){
  if(d.type==='earth')return tex512((ctx,w,h)=>{
    const oc=ctx.createLinearGradient(0,0,0,h);
    oc.addColorStop(0,'#2a7ac8');oc.addColorStop(.5,'#1d63b8');oc.addColorStop(1,'#2a7ac8');
    ctx.fillStyle=oc;ctx.fillRect(0,0,w,h);
    // 대륙: 여러 타원을 겹쳐서
    for(let c=0;c<7;c++){
      const cx=Math.random()*w, cy=h*0.2+Math.random()*h*0.6;
      for(let i=0;i<7;i++){
        blob(ctx,cx+(Math.random()-0.5)*90,cy+(Math.random()-0.5)*40,
          Math.random()*34+12,Math.random()*20+8,
          Math.random()<0.7?'#3aa060':'#8a9a4a',0.95);
      }
    }
    // 극지방 얼음
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.fillRect(0,0,w,14);ctx.fillRect(0,h-14,w,14);
    for(let i=0;i<24;i++){
      blob(ctx,Math.random()*w,Math.random()<0.5?16:h-16,Math.random()*22+8,7,'#fff',0.8);
    }
  });
  if(d.type==='jupiter')return tex512((ctx,w,h)=>{
    const cols=['#e8c9a0','#c48c5c','#f0dcc0','#a86a40','#e0b088','#d4a070'];
    let y=0,ci=0;
    while(y<h){const bh=Math.random()*20+10;
      ctx.fillStyle=cols[ci++%cols.length];ctx.fillRect(0,y,w,bh);y+=bh;}
    // 소용돌이 느낌의 길쭉한 구름
    for(let i=0;i<55;i++){
      blob(ctx,Math.random()*w,Math.random()*h,Math.random()*55+18,Math.random()*5+2,
        Math.random()<0.5?'#f4e4c8':'#96562e',0.28);
    }
    // 대적점 (큰 빨간 점)
    blob(ctx,w*0.68,h*0.63,30,17,'#b03a24',1);
    blob(ctx,w*0.68,h*0.63,20,11,'#d05a3a',1);
    blob(ctx,w*0.68,h*0.63,9,5,'#e88a6a',1);
  });
  if(d.type==='saturn')return tex512((ctx,w,h)=>{
    const cols=['#f0e0b0','#dcc488','#e8d8a8','#c8ac70','#f4e8c4'];
    let y=0,ci=0;
    while(y<h){const bh=Math.random()*24+12;
      ctx.fillStyle=cols[ci++%cols.length];ctx.fillRect(0,y,w,bh);y+=bh;}
    for(let i=0;i<35;i++)
      blob(ctx,Math.random()*w,Math.random()*h,Math.random()*60+20,Math.random()*4+2,'#fff8e0',0.2);
  });
  if(d.type==='sun')return tex512((ctx,w,h)=>{
    ctx.fillStyle='#ffa510';ctx.fillRect(0,0,w,h);
    for(let i=0;i<400;i++)  // 끓는 표면 알갱이
      blob(ctx,Math.random()*w,Math.random()*h,Math.random()*7+2,Math.random()*7+2,
        Math.random()<0.5?'#ff7800':'#ffd050',0.5);
    for(let i=0;i<14;i++)   // 흑점
      blob(ctx,Math.random()*w,Math.random()*h,Math.random()*8+3,Math.random()*5+2,'#c05000',0.75);
  });
  if(d.type==='crater')return tex512((ctx,w,h)=>{
    ctx.fillStyle=hexCss(d.color);ctx.fillRect(0,0,w,h);
    for(let i=0;i<70;i++){   // 크레이터
      const x=Math.random()*w,y=Math.random()*h,r=Math.random()*11+2;
      blob(ctx,x,y,r,r*0.8,'#6b625c',0.7);
      blob(ctx,x-r*0.25,y-r*0.25,r*0.55,r*0.45,'#c8c0b8',0.5);
    }
  });
  if(d.type==='venus')return tex512((ctx,w,h)=>{
    ctx.fillStyle='#e8b858';ctx.fillRect(0,0,w,h);
    for(let i=0;i<60;i++)   // 소용돌이 구름
      blob(ctx,Math.random()*w,Math.random()*h,Math.random()*70+25,Math.random()*9+4,
        Math.random()<0.5?'#f8dc9c':'#c89040',0.30);
  });
  if(d.type==='mars')return tex512((ctx,w,h)=>{
    ctx.fillStyle='#c1502a';ctx.fillRect(0,0,w,h);
    for(let i=0;i<50;i++)
      blob(ctx,Math.random()*w,Math.random()*h,Math.random()*28+8,Math.random()*14+5,
        Math.random()<0.5?'#96361c':'#d87848',0.4);
    ctx.fillStyle='rgba(255,255,255,.92)'; // 극관
    ctx.fillRect(0,0,w,12);ctx.fillRect(0,h-12,w,12);
  });
  if(d.type==='europa')return tex512((ctx,w,h)=>{
    ctx.fillStyle='#e8eef2';ctx.fillRect(0,0,w,h);
    for(let i=0;i<40;i++){ // 유명한 갈색 균열
      ctx.strokeStyle=Math.random()<0.5?'rgba(160,90,50,.75)':'rgba(120,70,40,.55)';
      ctx.lineWidth=Math.random()*3+1;
      ctx.beginPath();
      let x=Math.random()*w,y=Math.random()*h;ctx.moveTo(x,y);
      for(let k=0;k<4;k++){x+=(Math.random()-0.5)*140;y+=(Math.random()-0.5)*60;ctx.lineTo(x,y);}
      ctx.stroke();
    }
  });
  if(d.type==='enceladus')return tex512((ctx,w,h)=>{
    ctx.fillStyle='#f4f8fb';ctx.fillRect(0,0,w,h);
    for(let i=0;i<30;i++)blob(ctx,Math.random()*w,Math.random()*h,Math.random()*40+15,Math.random()*7+3,'#d8e4ee',0.7);
    for(let i=0;i<5;i++){ // 남극 호랑이 줄무늬(물기둥이 나오는 곳)
      ctx.strokeStyle='rgba(120,160,190,.8)';ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(60+i*30,h-30);ctx.lineTo(120+i*30,h-6);ctx.stroke();
    }
  });
  if(d.type==='titan')return tex512((ctx,w,h)=>{
    ctx.fillStyle='#e8a83c';ctx.fillRect(0,0,w,h);
    for(let i=0;i<45;i++)blob(ctx,Math.random()*w,Math.random()*h,Math.random()*60+20,Math.random()*10+4,
      Math.random()<0.5?'#f4c76a':'#c07a20',0.35);
    for(let i=0;i<7;i++)blob(ctx,Math.random()*w,h*0.2+Math.random()*h*0.2,Math.random()*22+10,Math.random()*8+4,'#4a3a2a',0.6); // 메탄 호수
  });
  // 얼음 행성 (천왕성/해왕성)
  return tex512((ctx,w,h)=>{
    const g=ctx.createLinearGradient(0,0,0,h);
    const c=hexCss(d.color);
    g.addColorStop(0,c);g.addColorStop(0.5,c);g.addColorStop(1,c);
    ctx.fillStyle=c;ctx.fillRect(0,0,w,h);
    for(let i=0;i<25;i++)
      blob(ctx,Math.random()*w,Math.random()*h,Math.random()*80+30,Math.random()*6+3,
        '#ffffff',0.12);
    if(d.id==='neptune')  // 검은 점
      blob(ctx,w*0.4,h*0.5,22,13,'#20308a',0.85);
  });
}
// 부드러운 원형 글로우 스프라이트
function glowSprite(color,alpha){
  const cv=document.createElement('canvas');cv.width=cv.height=128;
  const ctx=cv.getContext('2d');
  const g=ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,`rgba(${color},${alpha})`);
  g.addColorStop(0.4,`rgba(${color},${alpha*0.4})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,128,128);
  return new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(cv),transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false}));
}

const bodies=[];
function addMoon(parentMesh,r,orbitR,speed,color){
  const pivot=new THREE.Object3D();
  pivot.rotation.y=Math.random()*Math.PI*2;
  pivot.rotation.x=(Math.random()-0.5)*0.3;
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),
    new THREE.MeshStandardMaterial({color,roughness:1}));
  m.position.x=orbitR;
  pivot.add(m);
  parentMesh.add(pivot);
  if(parentMesh.userData.id==='earth')window.earthMoonMesh=m;
  parentMesh.userData.moons=parentMesh.userData.moons||[];
  parentMesh.userData.moons.push({pivot,speed});
  return m;
}
DATA.forEach(d=>{
  const geo=new THREE.SphereGeometry(d.size,24,16);
  const mat = d.type==='blackhole'
    ? new THREE.MeshBasicMaterial({color:0x030106})
    : d.type==='sun'
    ? new THREE.MeshBasicMaterial({map:texFor(d)})
    : new THREE.MeshStandardMaterial({map:texFor(d),roughness:.92,metalness:0});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.userData=d;
  const pivot=new THREE.Object3D();
  pivot.rotation.y=Math.random()*Math.PI*2;
  mesh.position.x=d.dist;
  pivot.add(mesh);
  scene.add(pivot);

  if(d.type==='sun'){
    // 여러 겹 코로나 글로우
    const g1=glowSprite('255,170,60',0.9);g1.scale.setScalar(d.size*4.2);
    const g2=glowSprite('255,220,150',0.6);g2.scale.setScalar(d.size*2.9);
    mesh.add(g1,g2);
    mesh.userData.glows=[g1,g2];
  }
  if(d.type==='earth'){
    // 구름층
    const cloudTex=tex512((ctx,w,h)=>{
      ctx.clearRect(0,0,w,h);
      for(let i=0;i<40;i++)
        blob(ctx,Math.random()*w,Math.random()*h,Math.random()*36+10,Math.random()*8+3,'#ffffff',0.75);
    });
    cloudTex.premultiplyAlpha=true;
    const clouds=new THREE.Mesh(new THREE.SphereGeometry(d.size*1.035,18,12),
      new THREE.MeshStandardMaterial({map:cloudTex,transparent:true,depthWrite:false,roughness:1}));
    mesh.add(clouds);
    mesh.userData.clouds=clouds;
    // 대기 글로우
    const atm=new THREE.Mesh(new THREE.SphereGeometry(d.size*1.16,16,12),
      new THREE.MeshBasicMaterial({color:0x4488ff,transparent:true,opacity:0.16,
        side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));
    mesh.add(atm);
    addMoon(mesh,0.4,2.9,1.2,0xc8c8d0);
  }
  if(d.type==='saturn'){
    // 여러 겹 고리 (Solar System Scope처럼 층이 보이게)
    [[1.35,1.62,0xd8c090,.85],[1.68,1.95,0xf0e0b8,.65],[2.0,2.3,0xc0a878,.5]].forEach(([r1,r2,col,op])=>{
      const ring=new THREE.Mesh(new THREE.RingGeometry(d.size*r1,d.size*r2,40),
        new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide,transparent:true,opacity:op}));
      ring.rotation.x=Math.PI/2.4;
      mesh.add(ring);
    });
    window.titanMesh=addMoon(mesh,0.32,7,0.5,0xd8b070);      // 타이탄
    window.enceladusMesh=addMoon(mesh,0.20,5.2,0.75,0xf0f6fa); // 엔셀라두스
  }
  if(d.id==='uranus'){
    mesh.rotation.z=Math.PI/2.1;
    const ring=new THREE.Mesh(new THREE.RingGeometry(d.size*1.6,d.size*1.75,32),
      new THREE.MeshBasicMaterial({color:0xa8e8f0,side:THREE.DoubleSide,transparent:true,opacity:.35}));
    ring.rotation.x=Math.PI/2;
    mesh.add(ring);
  }
  if(d.id==='jupiter'){  // 갈릴레이 4형제
    addMoon(mesh,0.26,5.4,1.1,0xe8d060); // 이오
    window.europaMesh=addMoon(mesh,0.24,6.2,0.85,0xe8e8f0); // 유로파
    addMoon(mesh,0.34,7.1,0.62,0xb0a898); // 가니메데
    addMoon(mesh,0.30,8.0,0.45,0x807868); // 칼리스토
  }
  if(d.id==='mars'){
    addMoon(mesh,0.13,2.1,1.6,0x9a8878);
    addMoon(mesh,0.11,2.8,1.1,0x8a7868);
  }
  if(d.type==='blackhole'){
    const S=d.size;
    // 강착원반: 안쪽은 백열, 바깥쪽은 식어가는 붉은빛 (진짜 블랙홀 색감)
    function diskTex(stops){
      const cv=document.createElement('canvas');cv.width=256;cv.height=8;
      const ctx=cv.getContext('2d');
      const g=ctx.createLinearGradient(0,0,256,0);
      stops.forEach(([p,c])=>g.addColorStop(p,c));
      ctx.fillStyle=g;ctx.fillRect(0,0,256,8);
      return new THREE.CanvasTexture(cv);
    }
    const diskA=new THREE.Mesh(new THREE.RingGeometry(S*1.25,S*2.1,80),
      new THREE.MeshBasicMaterial({map:diskTex([[0,'#3a0000'],[0.15,'#ff5a1a'],[0.5,'#fff6d0'],[0.85,'#ff5a1a'],[1,'#3a0000']]),
        side:THREE.DoubleSide,transparent:true,opacity:.95,blending:THREE.AdditiveBlending}));
    diskA.rotation.x=Math.PI/2.2;
    const diskB=new THREE.Mesh(new THREE.RingGeometry(S*2.15,S*3.0,80),
      new THREE.MeshBasicMaterial({map:diskTex([[0,'#1a0010'],[0.2,'#8a1a3a'],[0.5,'#c04a2a'],[0.8,'#5a1030'],[1,'#1a0010']]),
        side:THREE.DoubleSide,transparent:true,opacity:.55,blending:THREE.AdditiveBlending}));
    diskB.rotation.x=Math.PI/2.2;
    mesh.add(diskA,diskB);
    mesh.userData.disks=[diskA,diskB];
    // 🌌 중력 렌즈 후광 고리 (사건의 지평선을 감싸는, 인터스텔라 스타일)
    const haloTex=diskTex([[0,'#ffe9c0'],[0.5,'#ffb060'],[1,'#ffe9c0']]);
    const halo=new THREE.Mesh(new THREE.RingGeometry(S*1.04,S*1.16,80),
      new THREE.MeshBasicMaterial({map:haloTex,side:THREE.DoubleSide,transparent:true,
        opacity:.9,blending:THREE.AdditiveBlending}));
    halo.rotation.x=0.18; // 거의 정면 — 구체를 위아래로 감싸는 느낌
    mesh.add(halo);
    mesh.userData.halo=halo;
    // 사건의 지평선 밀착 광채 (타이트하게)
    const rim=glowSprite('180,140,255',0.9);rim.scale.setScalar(S*1.35);
    mesh.add(rim);
    const glow=glowSprite('120,70,220',0.35);glow.scale.setScalar(S*3.0);
    mesh.add(glow);
    // 안으로 빨려 들어가는 별가루
    const n=110,pos=new Float32Array(n*3);
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, r=S*(1.3+Math.random()*2.0);
      pos[i*3]=Math.cos(a)*r; pos[i*3+1]=(Math.random()-0.5)*S*0.4; pos[i*3+2]=Math.sin(a)*r;
    }
    const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const sparkle=new THREE.Points(pg,new THREE.PointsMaterial({color:0xffe0c0,size:0.16,transparent:true,opacity:.9}));
    mesh.add(sparkle);
    mesh.userData.sparkle=sparkle;
  }
  if(d.dist>0){
    const pts=[];

let ringView=false,ringChunksG=null,ringMarker=null;
function ensureRingChunks(){
  if(ringChunksG)return;
  const sat=bodies.find(b=>b.data.id==='saturn');if(!sat)return;
  const S=sat.data.size;
  ringChunksG=new THREE.Object3D();
  ringChunksG.rotation.x=Math.PI/2.4;
  const mats=[0xe8f0f8,0xc8ccd4,0xb8a88c].map(c=>new THREE.MeshStandardMaterial({color:c,emissive:0x333844,roughness:.6}));
  function chunk(a,r){
    const sz=0.04+Math.random()*0.11;
    const m=new THREE.Mesh(new THREE.IcosahedronGeometry(sz,0),mats[Math.floor(Math.random()*3)]);
    m.position.set(Math.cos(a)*r,Math.sin(a)*r,(Math.random()-0.5)*0.12);
    m.rotation.set(Math.random()*3,Math.random()*3,0);
    ringChunksG.add(m);
  }
  for(let i=0;i<34;i++)chunk((Math.random()-0.5)*1.1,S*(1.45+Math.random()*0.75));
  for(let i=0;i<14;i++)chunk(Math.random()*Math.PI*2,S*(1.45+Math.random()*0.75));
  ringMarker=new THREE.Object3D();
  ringMarker.position.set(S*1.8,0,0);
  ringChunksG.add(ringMarker);
  ringChunksG.visible=false;
  sat.mesh.add(ringChunksG);
}

}

  const id=b.data.id;

  showToast('🎉 '+b.data.name+' 탐험 도장 획득!');

    setTimeout(()=>showToast('🏆 태양계 마스터! 모든 별을 탐험했어요!'),2400);

function questTargets(){return bodies.filter(b=>b.data.id!=='blackhole');}
function updateQuestBtn(){

function deliverLetter(b){
  if(quest[b.data.id])return;
  quest[b.data.id]=1;
  try{localStorage.setItem('space_quest',JSON.stringify(quest));}catch(e){}
  updateQuestBtn();
  const t=questTargets(),done=t.filter(x=>quest[x.data.id]).length;
  showToast(`📬 ${b.data.name} 편지 배달 완료! (${done}/${t.length})`);
  if(done===t.length)setTimeout(()=>showToast('🏆 우주 우체부 마스터! 모든 편지를 배달했어요!'),2400);

function openQuest(){
  const t=questTargets();

    return `<div class="qrow ${d?'done':''}"><span class="qi">${d?'✅':'📩'}</span>
      <span class="qn">${i+1}. ${b.data.name}</span>

const SKY_TINT={sun:'#7a2a0a',mercury:'#2a2420',venus:'#5a4014',earth:'#0a2a4a',moon:'#0a0a18',
 mars:'#4a1f10',jupiter:'#3a2a18',saturn:'#3a3018',uranus:'#0a3a3e',neptune:'#0a1a4e'};
let landCapIdx=0,landAutoTimer=null;
function landStarsDraw(){
  const cv=document.getElementById('landStars');
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=innerWidth*dpr;cv.height=innerHeight*0.46*dpr;
  cv.style.width='100%';cv.style.height='100%';
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  for(let i=0;i<130;i++){
    ctx.globalAlpha=Math.random()*.8+.15;
    ctx.fillStyle='#fff';
    const r=Math.random()<0.9?Math.random()*1.2+.4:Math.random()*2+1;
    ctx.beginPath();ctx.arc(Math.random()*innerWidth,Math.random()*innerHeight*0.46,r,0,7);ctx.fill();
  }
}

// ---------- 🎮 RPG 탐사 로직 ----------
let walkX=0,walkDir=0,jumpY=0,jumpV=0,onGround=true,rpgItems=[],rpgDone=0,rpgSolid=false;
const WORLD_W=2400;
function initRPG(d){
  rpgSolid=SOLID_IDS.includes(d.id);
  walkX=0;walkDir=0;jumpY=0;jumpV=0;onGround=true;rpgDone=0;
  const ctrl=document.getElementById('landControls');
  const hud=document.getElementById('landHud');
  const itemsEl=document.getElementById('landItems');
  itemsEl.innerHTML='';rpgItems=[];lastFootX=-999;
  const sh=document.getElementById('landShadow');
  if(sh)sh.style.display=SOLID_IDS.includes(d.id)?'':'none';
  if(rpgSolid){
    ctrl.style.display='flex';hud.style.display='';
    const list=[...(SURFACE[d.id]||[])];
    if(LIFE_CLUE[d.id])list.push(LIFE_CLUE[d.id]);
    list.forEach((it,i)=>{
      const el=document.createElement('div');
      el.className='landItem';el.id='ritem'+i;
      el.innerHTML=`<span class="ring"></span>${it.icon}`;
      itemsEl.appendChild(el);
      rpgItems.push({...it,el,got:false});
    });
    hud.textContent=`🎯 0 / ${rpgItems.length}`;
    const g=GRAV[d.id]||1;
    const times=(1/g).toFixed(1);
    document.getElementById('landCapText').textContent=
      `◀ ▶ 를 눌러 걸어다니고, 🦘로 점프해요! 여기선 지구보다 ${times}배 높이 뛸 수 있어요. 반짝이는 곳으로 가보세요!`;
  }else{
    ctrl.style.display='none';hud.style.display='none';
    // 가스 행성: 땅이 없다는 사실을 참여형 질문으로
    const hq=HOVER_Q[d.id];
    if(hq)setTimeout(()=>openLandCard({icon:'☁️',t:'여기 서 있을 수 있을까?',q:hq.q,a:hq.a},-1),700);
  }
  layoutRPG();
}
function layoutRPG(){
  const cx=innerWidth/2;
  rpgItems.forEach(it=>{ it.el.style.left=(cx+(it.x-walkX))+'px'; });
  const lander=document.getElementById('landLander');
  lander.style.left=(cx+(0-walkX)-40)+'px';
  lander.style.right='auto';
  // 원근 스크롤: 가까운 바닥은 빠르게, 먼 언덕은 느리게 (깊이감)
  const ground=document.getElementById('landGround');
  if(ground)ground.style.backgroundPositionX=(-walkX*0.85)+'px';
  const hills=document.getElementById('landHills');
  if(hills)hills.style.backgroundPositionX=(-walkX*0.22)+'px';
  const sky=document.getElementById('landSkyBody');
  if(sky)sky.style.marginRight=(walkX*0.035)+'px';   // 하늘의 천체는 아주 느리게
  // 우주인: 점프 반영
  const wrap=document.getElementById('landCharWrap');
  if(wrap)wrap.style.transform=`translateX(-50%) translateY(${-jumpY}px)`;
  const flip=document.getElementById('landCharFlip');
  if(flip&&walkDir!==0)flip.style.transform=`scaleX(${walkDir<0?-1:1})`;
  // 그림자: 점프하면 작아지고 옅어져요
  const sh=document.getElementById('landShadow');
  if(sh){
    const k=Math.max(0,1-jumpY/260);
    sh.style.transform=`translateX(-50%) scale(${0.45+k*0.55})`;
    sh.style.opacity=(0.25+k*0.55).toFixed(2);
  }
  // 걷기 동작
  const ch=document.getElementById('landChar');
  if(ch&&rpgSolid){
    const walking=(walkDir!==0&&onGround);
    if(walking&&!ch.classList.contains('walkBob')){ch.classList.add('walkBob');ch.classList.remove('a-idle');}
    if(!walking&&ch.classList.contains('walkBob')){ch.classList.remove('walkBob');ch.classList.add('a-idle');}
  }
}

let lastFootX=-999;
function dropFootprint(){
  if(!rpgSolid||!onGround)return;
  if(Math.abs(walkX-lastFootX)<95)return;
  lastFootX=walkX;
  const layer=document.getElementById('landItems');
  if(!layer)return;
  const f=document.createElement('div');
  f.className='footPrint';
  f.textContent='👣';
  f.dataset.wx=walkX;

  const all=layer.querySelectorAll('.footPrint');

}
function layoutFootprints(){
  const cx=innerWidth/2;

    f.style.left=(cx+(+f.dataset.wx-walkX))+'px';
  });
}
function updateRPG(dt){
  if(!rpgSolid)return;
  const g=(GRAV[focus.data.id]||1);
  if(walkDir!==0){
    walkX=Math.max(0,Math.min(WORLD_W,walkX+walkDir*230*dt));
  }
  if(!onGround){
    jumpV-=Math.max(g,0.16)*1750*dt;
    jumpY+=jumpV*dt;
    if(jumpY>260){jumpY=260;jumpV=Math.min(jumpV,0);}

  }

// 화면 크기에 딱 맞게 카드 크기·열 수 계산 (겹침 방지)
function layoutCG(){
  const board=document.getElementById('cgBoard');
  if(!board||!board.classList.contains('on'))return;
  const total=cgPairs*2;
  const r=board.getBoundingClientRect();
  const W=r.width||innerWidth, H=r.height||innerHeight*0.7;
  const gap=Math.max(6,Math.min(14,W*0.016));
  let best=null;
  // 가능한 열 수 중 카드가 가장 크게 보이는 배치를 선택
  for(let cols=2;cols<=Math.min(total,6);cols++){
    const rows=Math.ceil(total/cols);
    const cw=(W-gap*(cols-1))/cols;
    const ch=(H-gap*(rows-1))/rows;
    const size=Math.min(cw,ch*0.75);   // 카드 비율 3:4
    if(size>0&&(!best||size>best.size))best={cols,size};
  }
  if(!best)return;
  const size=Math.max(40,Math.floor(best.size));
  board.style.gap=gap+'px';
  board.style.gridTemplateColumns=`repeat(${best.cols}, ${size}px)`;
}
addEventListener('resize',()=>layoutCG());
function cgFlip(card){
  if(cgLock||card.classList.contains('flip')||card.classList.contains('done'))return;
  card.classList.add('flip');
  if(!cgFirst){cgFirst=card;return;}
  cgLock=true;cgMoves++;
  document.getElementById('cgStat').textContent='뒤집기 '+cgMoves;
  const a=cgFirst,b=card;cgFirst=null;
  if(a.dataset.id===b.dataset.id){
    setTimeout(()=>{
      a.classList.add('done');b.classList.add('done');
      cgMatched++;cgLock=false;
      if(cgMatched===cgPairs)setTimeout(cgWin,600);
    },420);
  }else{
    setTimeout(()=>{a.classList.remove('flip');b.classList.remove('flip');cgLock=false;},1100);
  }
}
function cgWin(){
  let best={};try{best=JSON.parse(localStorage.getItem('space_cg')||'{}');}catch(e){}
  const prev=best[cgPairs];
  const isNew=!prev||cgMoves<prev;
  if(isNew){best[cgPairs]=cgMoves;try{localStorage.setItem('space_cg',JSON.stringify(best));}catch(e){}}
  document.getElementById('cgWinIcon').textContent=isNew?'🏆':'🎉';
  document.getElementById('cgWinText').textContent=isNew?'신기록 달성!':'모두 찾았어요!';
  document.getElementById('cgWinSub').innerHTML=
    `${cgMoves}번 만에 성공했어요!<br>${isNew?'✨ 지금까지 중 최고 기록이에요!':`🏅 최고 기록은 ${prev}번이에요`}`;
  document.getElementById('cgWin').classList.add('on');
}

function tapAt(x,y){
  if(mode==='AUTO'||mode==='INSPECT')return;

  if(rc.width<2||rc.height<2)return;

  ray.setFromCamera(ndc,camera);

  $('posbar').innerHTML=`<div class="pos-row">${row}</div><div class="pos-lbl">${posText}</div>`;
  const earthPx=22;
  let px=earthPx*d.cmp, note='';
  if(px>84){px=84;note='(진짜로는 훨씬훨씬 더 커요!)';}
  if(px<10)px=10;
  const grad = d.type==='sun'
    ? 'radial-gradient(circle at 35% 30%,#fff3b0,#ffd23f 45%,#ff8c1a)'
    : `radial-gradient(circle at 35% 30%, rgba(255,255,255,.7), #${d.color.toString(16).padStart(6,'0')} 55%)`;
  $('compare').innerHTML = d.id==='earth'
    ? `<div class="cmp-item"><div class="cmp-ball cmp-earth" style="width:${earthPx*1.6}px;height:${earthPx*1.6}px"></div><div class="cmp-lbl">지구 = 우리의 기준!</div></div>`
    : `<div class="cmp-item"><div class="cmp-ball cmp-earth" style="width:${earthPx}px;height:${earthPx}px"></div><div class="cmp-lbl">지구</div></div>
       <div class="cmp-item"><div class="cmp-ball" style="width:${px}px;height:${px}px;background:${grad}"></div><div class="cmp-lbl">${d.name}</div></div>
       ${note?`<div class="cmp-note">${note}</div>`:''}`;
  showFact();
  $('card').classList.add('on');
  const idx=bodies.indexOf(focus);
  $('nextBtn').style.display=idx<bodies.length-1?'':'none';
  document.getElementById('landBtn').style.display='';
  document.getElementById('landBtn').textContent=
    SOLID_IDS.includes(d.id)?'🚀 착륙해서 살펴보기':'☁️ 가까이 가서 살펴보기';
}

function showFact(){
  const f=focus.data.facts;
  $('cardFact').textContent=f[factIdx];
  $('factBtn').textContent=factIdx<f.length-1?'다음 이야기 ✨':'처음부터 다시 📖';
}
$('factBtn').onclick=()=>{factIdx=(factIdx+1)%focus.data.facts.length;showFact();};
$('nextBtn').onclick=()=>{
  const idx=bodies.indexOf(focus);
  if(idx<bodies.length-1)startAuto(bodies[idx+1]);
};
$('resumeBtn').onclick=()=>{
  hideCard();
  mode='FLY';
  arriveCooldown=3;
  $('boostBtn').style.display='';
  $('hint').style.display='';
  const p=worldPos(focus);
  const out=shipObj.position.clone().sub(p).normalize();
  yaw=Math.atan2(out.x,out.z);
  pitch=0;
};
function hideCard(){$('card').classList.remove('on');}

// ---- 360도 관찰 ----
$('inspectBtn').onclick=enterInspect;
$('inspectExit').onclick=exitInspect;
$('ringBtn').onclick=()=>{
  showLife(false);
  ringView=!ringView;
  ensureRingChunks();
  if(ringChunksG)ringChunksG.visible=ringView;
  $('ringBtn').textContent=ringView?'🪐 토성 전체 보기':'💍 고리 확대!';
  $('inspectHint').textContent=ringView
    ?'❄️ 반짝이는 조각들이 전부 얼음과 돌이에요!'
    :'🔭 손가락으로 빙글빙글 돌리고, 두 손가락으로 크게 봐요!';
  $('inspectMission').textContent=ringView
    ?'🔍 미션: 제일 큰 얼음 덩어리를 찾아라!'
    :(MISSIONS[focus.data.id]||'');
};
function enterInspect(){
  if(!focus)return;
  mode='INSPECT';
  hideCard();
  shipObj.visible=false;
  const p=worldPos(focus);
  // 태양빛이 비추는 밝은 쪽에서 바라보기!
  if(focus.data.dist>0){
    inspectDir.copy(p).normalize().negate(); // 행성→태양 방향
    inspectDir.y+=0.3;
    inspectDir.normalize();
  }else{
    inspectDir.set(0,0.3,1).normalize();
  }
  inspectDist=focus.data.size*3.2+1.5;
  inspectLight.intensity=1.4;              // 관찰용 손전등 켜기
  if(window.loadHiTex)loadHiTex(focus);    // 2K 초고화질 자동 로드
  ringView=false;
  if(ringChunksG)ringChunksG.visible=false;
  $('ringBtn').style.display=focus.data.id==='saturn'?'':'none';
  $('ringBtn').textContent='💍 고리 확대!';
  showLife(false);
  $('lifeBtn').style.display=LIFE[focus.data.id]?'':'none';
  $('inspectHint').textContent='🔭 손가락으로 빙글빙글 돌리고, 두 손가락으로 크게 봐요!';
  $('inspectMission').textContent=MISSIONS[focus.data.id]||'';
  $('inspectName').textContent=`🔭 ${focus.data.name} 자세히 보기`;
  $('inspectUI').style.display='block';
  $('title').style.display='none';
  $('hint').style.display='none';
  $('boostBtn').style.display='none';
  $('mapBtn').style.display='none';
  $('timeBtn').style.display='none';
  $('qualBtn').style.display='none';
  $('flying').style.display='none';
}
function exitInspect(){
  mode='ARRIVED';
  showLife(false);
  ringView=false;
  if(ringChunksG)ringChunksG.visible=false;
  shipObj.visible=true;
  inspectLight.intensity=0;                // 손전등 끄기
  if(focus)focus.mesh.rotation.x=0;
  $('inspectUI').style.display='none';
  $('title').style.display='';
  $('mapBtn').style.display='';
  $('timeBtn').style.display='';
  $('qualBtn').style.display='';
  $('card').classList.add('on');
}

// ================= 이름표 =================
const tagWrap=document.getElementById('tags');
const tags=bodies.map(b=>{
  const el=document.createElement('div');
  el.className='tag'+(b.data.id==='earth'?' earth':'');
  tagWrap.appendChild(el);
  return el;
});
const beltTag=document.createElement('div');
beltTag.className='tag belt';
beltTag.textContent='· 소행성 벨트 ·';
tagWrap.appendChild(beltTag);
const tmpV=new THREE.Vector3();
function updateTags(){
  const rc=RC;  // 캐시된 표시 영역 (0.5초마다 갱신됨)
  if(rc.width<2||rc.height<2)return;
  const showTags=(mode==='FLY'||mode==='MAP');
  bodies.forEach((b,i)=>{
    if(!showTags){tags[i].style.display='none';return;}
    b.mesh.getWorldPosition(tmpV);
    const dist=Math.round(tmpV.distanceTo(shipObj.position));
    tmpV.y+=b.data.size+0.5;
    tmpV.project(camera);
    if(tmpV.z>1){tags[i].style.display='none';return;}
    tags[i].style.display='';
    tags[i].style.left=rc.left+(tmpV.x*0.5+0.5)*rc.width+'px';
    tags[i].style.top=rc.top+(-tmpV.y*0.5+0.5)*rc.height+'px';
    const nm=b.data.id==='earth'?'지구 · 우리 집!':b.data.name;
    tags[i].innerHTML=mode==='FLY'?`${nm}<span class="dist">${dist} 우주km</span>`:nm;
  });
  // 소행성대 이름표
  if(showTags){
    const a=belt.rotation.y;
    tmpV.set(Math.cos(a)*31.8,1,Math.sin(a)*31.8).project(camera);
    if(tmpV.z<=1){
      beltTag.style.display='';
      beltTag.style.left=rc.left+(tmpV.x*0.5+0.5)*rc.width+'px';
      beltTag.style.top=rc.top+(-tmpV.y*0.5+0.5)*rc.height+'px';
    }else beltTag.style.display='none';
  }else beltTag.style.display='none';
}

// ================= 스피드 라인 =================
const sp=document.getElementById('speed'),spx=sp.getContext('2d');
let lines=[];
function drawSpeed(active){
  if(!active){sp.style.display='none';lines=[];return;}
  sp.style.display='block';
  spx.clearRect(0,0,sp.width,sp.height);
  if(lines.length<26&&Math.random()<.6){
    const a=Math.random()*Math.PI*2;
    lines.push({a,r:Math.random()*60+30,s:Math.random()*18+10});
  }
  const cx=sp.width/2,cy=sp.height/2;
  spx.strokeStyle='rgba(180,210,255,.6)';spx.lineWidth=2;
  lines.forEach(l=>{
    const x1=cx+Math.cos(l.a)*l.r, y1=cy+Math.sin(l.a)*l.r;
    const x2=cx+Math.cos(l.a)*(l.r+l.s*1.6), y2=cy+Math.sin(l.a)*(l.r+l.s*1.6);
    spx.beginPath();spx.moveTo(x1,y1);spx.lineTo(x2,y2);spx.stroke();
    l.r+=l.s;
  });
  lines=lines.filter(l=>l.r<Math.max(cx,cy)*1.5);
}

// ================= 카메라 =================
const camPosTarget=new THREE.Vector3(), camLookTarget=new THREE.Vector3(), camLookNow=new THREE.Vector3();
let mapSpin=0;
function updateCamera(dt,dir){
  if(mode==='MAP'){
    mapSpin+=dt*0.04;
    const L=camera.aspect>1.2;               // 가로 화면이면 더 가까이!
    camPosTarget.set(Math.sin(mapSpin)*(L?40:60),L?68:100,Math.cos(mapSpin)*(L?40:60));
    camLookTarget.set(0,0,0);
  }else{
    const back=camera.aspect>1.2?6.2:7.5;   // 가로 화면이면 우주선을 더 크게
    camPosTarget.copy(shipObj.position).addScaledVector(dir,-back).addScaledVector(UP,2.2);
    camLookTarget.copy(shipObj.position).addScaledVector(dir,6);
  }
  camera.position.lerp(camPosTarget,Math.min(dt*4,1));
  camLookNow.lerp(camLookTarget,Math.min(dt*4,1));
  camera.lookAt(camLookNow);
}

// ================= 루프 =================
let W=0,H=0;
let RC={left:0,top:0,width:1,height:1};   // 캔버스 표시 영역 (캐시)
function currentBox(){
  RC=canvas.getBoundingClientRect();
  let w=Math.round(RC.width),h=Math.round(RC.height);
  if(w<2||h<2){w=innerWidth||1;h=innerHeight||1;RC={left:0,top:0,width:w,height:h};}
  return [w,h];
}
function resize(){
  const [w,h]=currentBox();
  if(w<2||h<2)return;
  if(w===W&&h===H)return;   // 진짜 바뀐 경우에만 (안전)
  W=w;H=h;
  renderer.setSize(W,H,false);
  sp.width=W;sp.height=H;
  camera.aspect=W/H;
  camera.updateProjectionMatrix();
}
resize();
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,300));
if(window.visualViewport)visualViewport.addEventListener('resize',resize);
// 앱 안 브라우저 대비 몇 차례 재확인
setTimeout(resize,150);setTimeout(resize,600);setTimeout(resize,1500);
if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(document.body);

const clock=new THREE.Clock();
const dirNow=new THREE.Vector3(0,0,-1);
let frameNo=0, loopErr=false;

function loop(){
  requestAnimationFrame(loop);
  if(document.hidden)return; // 화면 밖에선 그리기 중지
  try{
  if(++frameNo%30===0){
    resize(); // 크기가 바뀐 경우에만 내부에서 1회 조정됨 (안전)
    const d=document.getElementById('dbg');
    if(d)d.textContent=`v23 · ${W}×${H} · ${mode} · ${Math.round(RC.width)}×${Math.round(RC.height)}`;
    const st=document.getElementById('stamps');
    if(st)st.style.display=(mode==='FLY'||mode==='MAP')?'':'none';
    const qb=document.getElementById('questBtn');
    if(qb)qb.style.display=(mode==='FLY'||mode==='MAP'||mode==='ARRIVED')?'':'none';
    const gb=document.getElementById('gameBtn');
    if(gb)gb.style.display=(mode==='FLY'||mode==='MAP')?'':'none';
  }
  const dt=Math.min(clock.getDelta(),0.05);
  arriveCooldown=Math.max(0,arriveCooldown-dt);
  const ts=timeScale;

  // 공전/자전 (시간 배속 반영)
  bodies.forEach(b=>{
    b.pivot.rotation.y+=b.angleSpeed*dt*0.4*ts;
    if(!(mode==='INSPECT'&&b===focus))b.mesh.rotation.y+=dt*0.15*(1+ts*0.5);
    if(b.mesh.userData.moons)
      b.mesh.userData.moons.forEach(m=>{m.pivot.rotation.y+=m.speed*dt*(0.5+ts*0.5);});
    if(b.mesh.userData.clouds)b.mesh.userData.clouds.rotation.y+=dt*0.05;
    if(b.mesh.userData.glows){
      const s=1+Math.sin(clock.elapsedTime*1.5)*0.05;
      b.mesh.userData.glows[0].scale.setScalar(b.data.size*4.2*s);
    }
    if(b.mesh.userData.disks){
      b.mesh.userData.disks[0].rotation.z+=dt*1.3*ts;
      b.mesh.userData.disks[1].rotation.z-=dt*0.7*ts;
    }
    if(b.mesh.userData.halo)b.mesh.userData.halo.rotation.z+=dt*0.4*ts;
    if(b.mesh.userData.sparkle)b.mesh.userData.sparkle.rotation.y+=dt*0.9*ts;
  });
  belt.rotation.y+=dt*0.02*Math.max(ts,0.3);

  // 불꽃
  const f=shipModel.getObjectByName('flame'),f2=shipModel.getObjectByName('flame2');
  const flameBoost=(mode==='AUTO'||boost)?1.8:1;
  if(f)f.scale.set(1,(0.8+Math.random()*0.6)*flameBoost,1);
  if(f2)f2.scale.set(1,(0.8+Math.random()*0.7)*flameBoost,1);

  if(mode==='LANDED'){
    updateRPG(dt);
    if(loadingEl.style.display!=='none')loadingEl.style.display='none';
    return;                       // 3D 렌더 생략 (배터리 절약)
  }
  if(mode==='FLY'){
    bank=THREE.MathUtils.lerp(bank,0,dt*2);
    const dir=calcFwd();
    dirNow.lerp(dir,Math.min(dt*6,1)).normalize();
    const speed=boost?BOOST:CRUISE;
    shipObj.position.addScaledVector(dirNow,speed*dt);
    if(shipObj.position.length()>95){
      const inward=shipObj.position.clone().negate().normalize();
      yaw=THREE.MathUtils.lerp(yaw,Math.atan2(inward.x,inward.z),dt*1.5);
    }
    orientShip(dirNow,bank);
    if(arriveCooldown<=0){
      for(const b of bodies){
        if(b===focus)continue;
        if(worldPos(b).distanceTo(shipObj.position)<discoverRadius(b)){
          focus=b;arrive();break;
        }
      }
    }
    updateCamera(dt,dirNow);
    drawSpeed(boost);
  }
  else if(mode==='AUTO'&&autoTarget){
    const p=worldPos(autoTarget);
    const isBH=autoTarget.data.type==='blackhole';
    const stopR=autoTarget.data.size*2.6+1.5;
    const toT=p.clone().sub(shipObj.position);
    const dist=toT.length();
    const dir=toT.normalize();
    dirNow.lerp(dir,Math.min(dt*3,1)).normalize();
    // 블랙홀은 가까워질수록 가속 (빨려 들어가는 느낌)
    const pull=isBH?THREE.MathUtils.clamp(1-(dist/(stopR*5)),0,1):0;
    const speed=Math.min(isBH?42:26,Math.max(8,dist*0.5)+pull*30);
    shipObj.position.addScaledVector(dirNow,speed*dt);
    orientShip(dirNow,Math.sin(clock.elapsedTime*2)*0.15);
    if(isBH&&dist<stopR*3.2&&!bhFalling){ startBHFall(); }
    else if(!isBH&&dist<stopR){autoTarget=null;arrive();}
    updateCamera(dt,dirNow);
    drawSpeed(true);
  }
  else if(mode==='BHFALL'){
    bhFallT+=dt;
    const p=worldPos(autoTarget);
    const toT=p.clone().sub(shipObj.position);
    dirNow.lerp(toT.normalize(),Math.min(dt*3,1)).normalize();
    shipObj.position.addScaledVector(dirNow,(18+bhFallT*22)*dt); // 점점 더 빠르게 빨려듦
    orientShip(dirNow,bhFallT*3);
    camera.fov=THREE.MathUtils.lerp(55,95,Math.min(bhFallT/1.6,1)); // 화면이 확 늘어나는 왜곡감
    camera.updateProjectionMatrix();
    const back=Math.max(2.2,7.5-bhFallT*3);
    camPosTarget.copy(shipObj.position).addScaledVector(dirNow,-back).addScaledVector(UP,1.6);
    camera.position.lerp(camPosTarget,Math.min(dt*8,1));
    camLookNow.lerp(p,Math.min(dt*8,1));
    camera.lookAt(camLookNow);
    const fadeT=Math.min(bhFallT/2.0,1);
    document.getElementById('bhFade').style.opacity=fadeT;
    document.getElementById('bhMsg').style.opacity=Math.min(bhFallT/0.8,1)*(bhFallT<1.7?1:Math.max(0,1-(bhFallT-1.7)/0.4));
    drawSpeed(true);
    if(bhFallT>2.0){
      camera.fov=55;camera.updateProjectionMatrix();
      autoTarget=null;bhFalling=false;bhFallT=0;
      arrive();
      // 화면이 검게 덮인 동안 몰래 정위치로
      orbitAngle=0;
      const S=focus.data.size;
      shipObj.position.set(worldPos(focus).x+S*3.4,worldPos(focus).y+S*0.6,worldPos(focus).z);
      document.getElementById('bhMsg').textContent='🕳️ 블랙홀 속으로 빨려 들어가는 중...';
      setTimeout(()=>{document.getElementById('bhFade').style.transition='opacity 1.4s';
        document.getElementById('bhFade').style.opacity=0;
        setTimeout(()=>{document.getElementById('bhFade').style.transition='';},1500);
      },250);
    }
  }
  else if(mode==='ARRIVED'&&focus){
    const p=worldPos(focus);
    const r=focus.data.size*2.6+1.5;
    orbitAngle+=dt*0.35;
    shipObj.position.set(
      p.x+Math.cos(orbitAngle)*r,
      p.y+Math.sin(orbitAngle*0.7)*r*0.15,
      p.z+Math.sin(orbitAngle)*r);
    const tangent=new THREE.Vector3(-Math.sin(orbitAngle),0,Math.cos(orbitAngle)).normalize();
    dirNow.lerp(tangent,Math.min(dt*4,1)).normalize();
    orientShip(dirNow,0.2);
    const camBack=Math.max(3.2,6*Math.min(1,focus.data.size/2.2));   // 달처럼 작으면 더 가까이
    camPosTarget.copy(shipObj.position).addScaledVector(dirNow,-camBack).addScaledVector(UP,camBack*0.37);
    camera.position.lerp(camPosTarget,Math.min(dt*3,1));
    camLookNow.lerp(p,Math.min(dt*3,1));
    camera.lookAt(camLookNow);
    drawSpeed(false);
  }
  else if(mode==='INSPECT'&&focus){
    const p=worldPos(focus);
    if(ringView&&ringMarker){
      // 고리 사이를 천천히 여행하며 얼음 조각 사이로!
      ringChunksG.rotation.z+=dt*0.05;
      ringChunksG.children.forEach((c,i)=>{if(c!==ringMarker){c.rotation.x+=dt*(0.2+i%5*0.08);c.rotation.y+=dt*0.15;}});
      const rp=new THREE.Vector3();ringMarker.getWorldPosition(rp);
      const out=rp.clone().sub(p).normalize();
      camera.position.copy(rp).addScaledVector(out,focus.data.size*0.5);
      camera.position.y+=focus.data.size*0.26;
      camLookNow.copy(rp);
      camera.lookAt(rp);
    }else{
      camera.position.copy(p).addScaledVector(inspectDir,inspectDist);
      camLookNow.copy(p);
      camera.lookAt(p);
    }
    drawSpeed(false);
  }
  else if(mode==='MAP'){
    orientShip(dirNow,0);
    updateCamera(dt,dirNow);
    drawSpeed(false);
  }

  updateTags();
  renderer.render(scene,camera);
  if(loadingEl.style.display!=='none')loadingEl.style.display='none'; // 첫 화면이 그려지면 로딩 끝!
  }catch(err){
    if(!loopErr){loopErr=true;bootError('화면 그리기 중 오류: '+(err&&err.message||err));}
  }
}
loop();
</script>
